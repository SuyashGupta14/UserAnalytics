<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Demo Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🛒 DemoStore</div>
    <div class="nav-links">
      <a href="/demo/" id="nav-home" class="nav-link">Home</a>
      <a href="/demo/product.html" id="nav-product" class="nav-link">Product</a>
      <a href="/demo/pricing.html" id="nav-pricing" class="nav-link">Pricing</a>
      <a href="/demo/contact.html" id="nav-contact" class="nav-link active">Contact</a>
    </div>
  </nav>

  <section class="contact-hero">
    <h1>Get in Touch</h1>
    <p>Have questions? We'd love to hear from you.</p>
  </section>

  <section class="contact-form-section">
    <form class="contact-form" onsubmit="event.preventDefault(); alert('Demo: Form submitted!');">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" class="form-input">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" class="form-input">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="How can we help?" class="form-input"></textarea>
      </div>
      <button type="submit" id="submit-form" class="btn btn-primary btn-lg">Send Message</button>
    </form>
  </section>

  <footer class="footer">
    <p>&copy; 2024 DemoStore. This is a demo site for testing analytics tracking.</p>
  </footer>

  <script src="/tracker.js" data-api="" data-debug="true" async></script>
</body>
</html>
